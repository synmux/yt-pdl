[project]
name = "yt-pdlp"
version = "0.0.0.dev3"
description = "Download a YouTube playlist with several concurrent yt-dlp workers and a live Textual UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.4.2", "textual>=8.2.7", "yt-dlp>=2026.6.9"]

[project.scripts]
yt-pdlp = "yt_pdlp.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_pdlp"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0a2",
  "ruff>=0.15.15",
  "ty>=0.0.40",
]
