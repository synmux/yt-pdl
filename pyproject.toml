[project]
name = "ytdlp-parallel"
version = "0.1.0"
description = "Download a YouTube playlist with several concurrent yt-dlp workers and a live Textual UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.4.1", "textual>=8.2.7", "yt-dlp>=2026.3.17"]

[project.scripts]
ytdlp-parallel = "ytdlp_parallel.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdlp_parallel"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.3.0", "ruff>=0.15.14", "ty>=0.0.39"]
